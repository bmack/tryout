# Serve the rendered documentation at /_docs/.
#
# The site stays in .site/ and nothing is written into public/: the docroot
# belongs to TYPO3, and a generated directory inside it would be something
# `ddev tryout delete` and Composer both have an opinion about. Apache maps
# the path instead, which is the same technique DDEV itself uses for
# /phpstatus.
#
# The leading underscore keeps the path out of TYPO3's way. A page slug named
# "docs" is an ordinary thing for a site to have, and an alias that quietly
# shadowed it would be a bug nobody thinks to look for here.
#
# This file is not #ddev-generated. DDEV copies every .conf in .ddev/apache/
# into the container's sites-enabled/, so this sits beside the generated
# apache-site.conf without modifying it — and keeps working when DDEV
# regenerates that file.
#
# Outside any <VirtualHost> on purpose: the generated config defines one for
# :80 and one for :443, and a mapping at server scope is inherited by both.
#
# Run `ddev docs` to fill .site/. Until then the path 404s, which is the
# honest answer.

Alias "/_docs" "/var/www/html/.site"

<Directory "/var/www/html/.site">
    Require all granted
    AllowOverride None
    DirectoryIndex index.html
</Directory>
