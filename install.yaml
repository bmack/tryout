name: tryout

ddev_version_constraint: '>= v1.24.10'

pre_install_actions:
  - |
    #ddev-description:Check host requirements
    # The tryout command runs on the HOST — prompts, herdr, tab completion — and
    # reads the Core checkout there (status, completion), so a host
    # git is still a hard requirement (on Windows this is Git Bash, which DDEV
    # finds itself). The work itself runs in the web container.
    if ! command -v git >/dev/null 2>&1; then
      echo "tryout needs 'git' on the host (Windows: install Git for Windows)."
      exit 1
    fi

    # git >= 2.48 writes worktree metadata with relative paths, which is what lets
    # the host read a worktree the container created (and the other way round).
    # The container gets its own git from web-build/Dockerfile.tryout; the host's
    # only reads, so an older one is a note rather than a refusal.
    gv=$(git --version 2>/dev/null | sed -n 's/^git version \([0-9]*\.[0-9]*\).*/\1/p')
    case "${gv}" in
      2.[0-9].*|2.[0-9]|2.[1-3][0-9]|2.4[0-7])
        echo "Note: host git ${gv} predates relative worktree paths (2.48)."
        echo "  Editors and 'git status' on Core worktrees created by tryout will"
        echo "  still work, but 'git worktree' commands on the host may not."
        ;;
    esac

    # gum draws the tables, prompts and spinners. It is OPTIONAL: without it the
    # ui_* helpers in functions.sh fall back to plain text and a typed prompt, so
    # every command still works — it just looks plainer. Hence a note, not an
    # exit. It cannot be sourced from functions.sh here (the payload is not
    # copied yet), so the platform hint is spelled out inline.
    if ! command -v gum >/dev/null 2>&1; then
      echo "Optional: 'gum' is not installed — tryout will use plain output."
      case "$(uname -s 2>/dev/null || echo "${OSTYPE:-}")" in
        Darwin|darwin*) echo "  -> brew install gum" ;;
        Linux|linux*)
          if command -v apt-get >/dev/null 2>&1; then
            echo "  -> sudo apt-get install gum"
          elif command -v dnf >/dev/null 2>&1; then
            echo "  -> sudo dnf install gum"
          elif command -v pacman >/dev/null 2>&1; then
            echo "  -> sudo pacman -S gum"
          else
            echo "  -> install 'gum' with your package manager"
          fi
          ;;
        *) echo "  -> see https://github.com/charmbracelet/gum#installation" ;;
      esac
      echo "  https://github.com/charmbracelet/gum#installation"
    fi

project_files:
  - commands/host/tryout
  - commands/host/autocomplete/tryout
  - config.tryout.yaml
  - tryout
  - web-build/Dockerfile.tryout

post_install_actions:
  # These run with the working directory set to the project's .ddev/, so the
  # project root is "..".
  - |
    #ddev-description:Make the tryout scripts executable
    chmod +x tryout/*.sh \
      commands/host/tryout commands/host/autocomplete/tryout

  - |
    #ddev-description:Install the Gerrit patch list
    # Not a project_files entry: it holds the user's patch list, so it is created
    # once and never overwritten by an update.
    if [ ! -f config.tryout-patches.yaml ]; then
      # Strip the marker and the template note: the installed copy is the user's,
      # so DDEV must not manage, overwrite or delete it.
      sed -e '/^#ddev-generated$/d' -e '/^# This is the TEMPLATE/,/^#$/d' \
        tryout/patches.yaml > config.tryout-patches.yaml
    fi

  - |
    #ddev-description:Install the Composer overlay
    # Never clobber an existing overlay — it carries the generated require block
    # plus whatever the user added to it.
    if [ ! -f ../composer.tryout.json ]; then
      cp tryout/composer.tryout.json ../composer.tryout.json
    fi

  - |
    #ddev-description:Create the packages/ and config/system/ directories
    # Deliberately absent from removal_actions: packages/ holds the user's own
    # extensions, so uninstalling the add-on must not take them with it.
    mkdir -p ../packages ../config/system

  - |
    #ddev-description:Install config/system/additional.php
    # Copy if absent, or if ours is still there unmodified. A hand-edited file
    # (marker removed) is left alone.
    if [ ! -f ../config/system/additional.php ] || grep -q '#ddev-generated' ../config/system/additional.php; then
      cp tryout/additional.php ../config/system/additional.php
    else
      echo "Skipping config/system/additional.php — it has been modified."
    fi

  - |
    #ddev-description:Install the project .gitignore
    if [ ! -f ../.gitignore ]; then
      cp tryout/gitignore ../.gitignore
    elif grep -q '#ddev-generated' ../.gitignore; then
      cp tryout/gitignore ../.gitignore
    else
      # Someone else's .gitignore: append only what tryout must have ignored,
      # and only once.
      for entry in /typo3-core /typo3-core-\* /sites/ /composer.tryout.json /composer.tryout.lock; do
        grep -qxF "$entry" ../.gitignore || printf '%s\n' "$entry" >> ../.gitignore
      done
    fi

  - |
    #ddev-description:Install the herdr plugin manifest
    # herdr reads herdr-plugin.toml from the directory it is pointed at, and the
    # paths inside it are relative to that directory — so the manifest belongs at
    # the project root, not under .ddev/. Registering the plugin stays the user's
    # call: `herdr plugin link <project>` when they want the panel.
    if [ ! -f ../herdr-plugin.toml ] || grep -q '#ddev-generated' ../herdr-plugin.toml; then
      cp tryout/herdr-plugin.toml ../herdr-plugin.toml
    else
      echo "Skipping herdr-plugin.toml — it has been modified."
    fi

  - |
    #ddev-description:Record the payload version
    # Lets `ddev tryout status` notice that a project is running an older copy
    # than the source it was installed from — the command and its tab-completion
    # keep working, they just offer the previous feature set.
    sed -n 's/^TRYOUT_VERSION=//p' tryout/functions.sh | head -1 > tryout/.version

  - |
    #ddev-description:Report next steps
    printf '\n  \033[32m✓\033[0m tryout installed.\n\n'
    printf '  Next: \033[36mddev start\033[0m — clones TYPO3 Core, installs dependencies\n'
    printf '        and sets up TYPO3 (several minutes on first run).\n\n'
    printf '  Then: \033[36mddev tryout status\033[0m\n'
    printf '        \033[36mddev tryout cs\033[0m      to prepare for Gerrit contribution\n\n'

removal_actions:
  - |
    #ddev-description:Remove the herdr plugin manifest
    # Only ours: a hand-edited manifest (marker gone) is the user's file now.
    if [ -f ../herdr-plugin.toml ] && grep -q '#ddev-generated' ../herdr-plugin.toml; then
      rm -f ../herdr-plugin.toml
    fi

  - |
    #ddev-description:Remove the Composer overlay
    if [ -f ../composer.tryout.json ] && grep -q '#ddev-generated' ../composer.tryout.json; then
      rm -f ../composer.tryout.json ../composer.tryout.lock
    fi

  - |
    #ddev-description:Remove config/system/additional.php
    if [ -f ../config/system/additional.php ] && grep -q '#ddev-generated' ../config/system/additional.php; then
      rm -f ../config/system/additional.php
    fi

  - |
    #ddev-description:Remove the project .gitignore
    if [ -f ../.gitignore ] && grep -q '#ddev-generated' ../.gitignore; then
      rm -f ../.gitignore
    fi

  - |
    #ddev-description:Remove the payload version stamp
    rm -f tryout/.version

  - |
    #ddev-description:Remove generated worktree config and vhosts
    rm -f config.worktrees.yaml apache/tryout-site-*.conf nginx_full/tryout-site-*.conf \
          nginx_full/tryout-server-names-hash.conf

  - |
    #ddev-description:Remove the patch list if it is still empty
    # Deliberately not #ddev-generated — it holds the user's Gerrit patch list and
    # must survive `ddev add-on get` updates. Only drop it if nothing was added.
    if [ -f config.tryout-patches.yaml ] && grep -qE '^\s*- TRYOUT_PATCHES=\s*$' config.tryout-patches.yaml; then
      rm -f config.tryout-patches.yaml
    fi
